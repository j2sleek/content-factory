name: Daily Funding Scrape

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          APPS_SCRIPT_ROUTER_URL: ${{ secrets.APPS_SCRIPT_ROUTER_URL }}
        run: |
          PYTHONPATH=. python scripts/run_scraper.py
      
      - name: Log completion
        run: |
          echo "Scrape completed at $(date -u)"
